name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read
  # Reading @fmmenchi/* from GitHub Packages. Declaring any `permissions` block zeroes
  # every scope left out of it, so without this line the token cannot fetch the package
  # metadata at all — and pnpm reports that 403 as ERR_PNPM_TARBALL_URL_MISMATCH.
  packages: read

# GitHub Packages wants a token even for public packages. `setup` configures the registry
# through actions/setup-node, which writes an npmrc referring to NODE_AUTH_TOKEN — so the
# token has to be in the environment of the install that runs INSIDE that composite action,
# and a job-level env is the only place a caller can put it. GITHUB_TOKEN is issued per
# run: nothing to create, nothing to rotate.
env:
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY_URL: https://npm.pkg.github.com

jobs:
  # One canonical "what kind of run is this?" — the jobs below consume these outputs
  # instead of each re-deriving github.event_name/github.ref conditions.
  #
  # It also publishes the Node version, because .nvmrc is this repo's single source for it
  # (pnpm refuses to install on anything else) and the setup brick takes a version string,
  # not a file. Read once here, passed down, still one source.
  context:
    runs-on: ubuntu-latest
    outputs:
      is-release: ${{ steps.ctx.outputs.is-release }}
      node-version: ${{ steps.node.outputs.version }}
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - id: ctx
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/compute-context@gh-actions/v0.2.0

      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

  main:
    runs-on: ubuntu-latest
    needs: context
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      # This enables task distribution via Nx Cloud. Run this command as early as possible,
      # BEFORE dependencies are installed — so it goes ahead of `setup`, which installs.
      # Learn more at https://nx.dev/docs/reference/nx-cloud-cli#npx-nxcloud-startcirun
      - run: npx nx start-ci-run --distribute-on="3 linux-medium-js" --stop-agents-after="e2e"

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ needs.context.outputs.node-version }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # `--all`, and NOT `--base="remotes/origin/main"`, which is what this was. On a pull
      # request that base is a real comparison; on a push to main it is HEAD itself, so the
      # changed-file set is empty and the step passed unconditionally — a green check that
      # checked nothing, on the one branch where it matters most. Repo-wide costs about a
      # second here, and it needed .prettierignore to name the generated trees first
      # (route typegen, build output) or it would trip on files nobody wrote.
      #
      # Prepend any command with "nx record --" to record its logs to Nx Cloud
      - name: Format check
        run: pnpm nx record -- pnpm nx format:check --all

      - name: Lint, test, build, typecheck, lint-css (all projects)
        run: pnpm nx run-many -t lint test build typecheck lint-css

      - name: E2E — Playwright flows + axe a11y sweep (real worker in miniflare)
        run: pnpm nx run-many -t e2e

      # Nx Cloud recommends fixes for failures to help you get CI green faster. Learn more: https://nx.dev/docs/features/ci-features/self-healing-ci
      - run: pnpm nx fix-ci
        if: always()

  # Trunk-based release: every green push to main versions the blog from its conventional
  # commits, tags `v{version}`, and creates the GitHub Release. It publishes nothing — every
  # project here is private — and the brick says so out loud rather than failing on it.
  release:
    runs-on: ubuntu-latest
    needs: [main, context]
    if: needs.context.outputs.is-release == 'true'
    outputs:
      # How many projects were released — '0' on a push with no releasable commits, which
      # is what gates the two jobs below.
      released: ${{ steps.release.outputs.released }}
    # Serialize releases: two quick merges must not run the tag-and-push concurrently.
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write
      # Job-level permissions REPLACE the workflow-level block rather than adding to it.
      packages: read
    env:
      HUSKY: 0 # git hooks are for humans; the release commit is machine-generated
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ needs.context.outputs.node-version }}
          registry-url: ${{ env.REGISTRY_URL }}

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      # It drives nx's release API with THIS repo's nx.json, so the outcome is unchanged:
      # one tag, `v{version}`, which is the tag the deploy below reads. What it adds is a
      # record of what it released — { project, version, tag } — which the two jobs below
      # consume instead of cutting a version back out of `git describe`.
      #
      # nx.json had to meet it halfway, and both halves are load-bearing. `projectChangelogs`
      # is on, because the brick reads each project's tag from there and a workspace-only
      # changelog leaves it empty. And `release.projects` is `["blog"]`, because with `["*"]`
      # a fixed group hands back one record PER PROJECT all carrying the same tag, and the
      # announce step turns every record into its own Slack message — measured: six records
      # in, six messages out, five of them "version bump only ... there were no code
      # changes". Narrowed, it is one record and one message. The visible trade is that a
      # commit touching only root files no longer cuts a version: nx attributes commits by
      # path, and `.github/**` is not `apps/blog`.
      - name: Release
        id: release
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/release@gh-actions/v0.2.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The record crosses the job boundary as an artifact, which is what lets "Re-run
      # failed jobs" re-attach an SBOM or re-announce without re-releasing.
      - name: Publish the release record
        if: steps.release.outputs.released != '0'
        uses: actions/upload-artifact@v4
        with:
          name: release-result
          path: ${{ steps.release.outputs.result-file }}
          if-no-files-found: error
          retention-days: 30

  # Attaching an SBOM and announcing are SEPARATE OPERATIONS from releasing, so they are
  # separate jobs: each fails, and is re-run, on its own. The release is irreversible; these
  # are not. The price is a checkout and an install per job, and it buys exactly that.
  sbom:
    runs-on: ubuntu-latest
    needs: [release, context]
    if: needs.release.outputs.released != '0'
    permissions:
      contents: write
      packages: read
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ needs.context.outputs.node-version }}
          registry-url: ${{ env.REGISTRY_URL }}

      - uses: actions/download-artifact@v4
        with:
          name: release-result
          path: ${{ runner.temp }}

      # A CycloneDX SBOM per released project, generated by @fmmenchi/nx-trivy from an
      # nx-pruned lockfile and uploaded to that Release. Nothing here parses a tag: the
      # record names the project.
      - name: Attach the SBOM to the release
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/attach-sbom@gh-actions/v0.2.0
        with:
          result-file: ${{ runner.temp }}/release-result.json
          github-token: ${{ secrets.GITHUB_TOKEN }}

  announce:
    runs-on: ubuntu-latest
    needs: [release, context]
    if: needs.release.outputs.released != '0'
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # Nothing in this job runs nx, but the notify brick resolves @fmmenchi/ci out of
      # node_modules, so the install is not optional.
      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ needs.context.outputs.node-version }}
          registry-url: ${{ env.REGISTRY_URL }}

      - uses: actions/download-artifact@v4
        with:
          name: release-result
          path: ${{ runner.temp }}

      # A GitHub Release created with the built-in GITHUB_TOKEN does not trigger other
      # workflows, so a `release: published` listener would never fire — announce from here.
      # The message is built and sent in tested TypeScript rather than curl and jq: the
      # failure that actually happens is Slack answering 200 while refusing the message, and
      # only a unit test pins that down. Missing secrets skip the step green and say so; a
      # message it was asked to send and could not is red.
      - name: Announce the release to Slack
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/notify@gh-actions/v0.2.0
        with:
          result-file: ${{ runner.temp }}/release-result.json
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}

  # Deploy to Cloudflare Workers on every green push to main.
  # Requires the CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repo secrets;
  # skips gracefully until they exist.
  #
  # It waits for `release`, and not merely for `main`, because the footer shows the
  # version: the tag this deploy carries is the one the release job cuts, and until
  # it exists there is nothing to read. Deploying in parallel would ship the previous
  # version, and only until the next push — a bug nobody would ever catch in the act.
  # It does NOT wait for sbom or announce: neither changes what gets served.
  deploy:
    runs-on: ubuntu-latest
    needs: [release, context]
    if: needs.context.outputs.is-release == 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          # The tag is the version. A shallow checkout has no tags at all.
          filter: tree:0
          fetch-depth: 0

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ needs.context.outputs.node-version }}
          registry-url: ${{ env.REGISTRY_URL }}

      # Baked into the bundle by apps/blog/vite.config.mts, and part of the Nx cache
      # key (nx.json → sharedGlobals), so this build cannot be served from the cache
      # the CI build filled before the tag existed.
      #
      # `v[0-9]*`, not `v*`, and that glob is load-bearing: a tag named `v{version}` —
      # nx's own pattern, written out literally — matched `v*`, sorted last, and got baked
      # into the bundle as the version. The footer read "{version}" on the live site until
      # the tag was deleted. Anything that is not a digit after the v is not a version.
      #
      # And NO `--abbrev=0`, which is the other half. This job runs on every push to main,
      # not only on a release — deliberately: an article correction lands as `docs(blog):`,
      # which conventional commits does not version, and gating the deploy on a release
      # would leave those fixes on main forever. But `--abbrev=0` reports the nearest tag
      # and nothing else, so those builds went out labelled with a version they were not.
      # Plain `git describe` says how far past the tag we are, and `-3-g6533588` becomes
      # `+3`: the footer reads `v1.8.4+3` when it is three commits past the release, and
      # `v1.8.4` when it IS the release. The commit is shown beside it either way.
      - name: Resolve the released version
        run: |
          echo "APP_VERSION=$(git describe --tags --match 'v[0-9]*' | sed -E 's/^v//; s/-([0-9]+)-g[0-9a-f]+$/+\1/')" >> "$GITHUB_ENV"
          echo "GIT_HASH=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"

      - name: Deploy to Cloudflare Workers
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set — skipping deploy."
            exit 0
          fi
          echo "Deploying v$APP_VERSION ($GIT_HASH)"
          pnpm nx run blog:deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
