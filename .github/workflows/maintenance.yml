name: Maintenance

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'Maintenance curtain'
        required: true
        type: choice
        options:
          - 'on'
          - 'off'

jobs:
  toggle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: 'pnpm'

      # The @fmmenchi packages live in GitHub Packages, which wants a token even for
      # public ones. It goes through `pnpm config set` rather than the repo's .npmrc:
      # pnpm will not expand a variable into a credential read from a committed file.
      # GITHUB_TOKEN is issued per run, so there is nothing to create or rotate.
      - name: Authenticate to GitHub Packages
        run: pnpm config set "//npm.pkg.github.com/:_authToken" "$GITHUB_TOKEN"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - run: pnpm install --frozen-lockfile

      - name: Toggle maintenance mode
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "CLOUDFLARE_API_TOKEN secret not set — cannot toggle." >&2
            exit 1
          fi
          pnpm nx run "blog:maintenance:${{ inputs.mode }}"
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
