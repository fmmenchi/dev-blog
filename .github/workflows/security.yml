name: Security

# A vulnerability scan is not like a test. A test goes red because the CODE changed; a
# scan goes red because the WORLD changed — a CVE was published against a dependency
# nobody touched. So it runs on two triggers, and it needs both:
#
#   - when the dependencies change, because that is when WE introduce something;
#   - every Monday, because that is when the world does.
#
# Running it on every push would tell us the same thing forty times a week and teach us
# to stop reading it.
#
# The scan itself is shared-platform's reusable workflow: the triggers below and the
# gating are the caller's business, everything after them is not this repo's to maintain.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  schedule:
    # Monday 06:00 UTC. Early enough that a bad Monday is still a Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # The ceiling for the called workflow, which cannot hold more than its caller grants —
  # the reusable's own install reads @fmmenchi/* from GitHub Packages. Granting it here is
  # necessary and not yet sufficient: a called workflow must also ASK for the scope, and at
  # gh-actions/v0.2.0 the reusable still declares `contents: read` alone. Its `setup` step
  # does not pass a registry-url either, so the install carries no credential for
  # npm.pkg.github.com. Until that side changes, the scan cannot fetch @fmmenchi/nx-trivy —
  # and pnpm reports that 403 as ERR_PNPM_TARBALL_URL_MISMATCH, not as an auth error.
  packages: read

jobs:
  # `alert-on-failure` only on the schedule: a pull request already shows a red check, and
  # a message that arrives every week regardless is a message nobody opens.
  #
  # `cache-db: false` keeps what this repo already decided, back when the scan was ours:
  # Trivy's DB expires in 21 hours (metadata.json, DownloadedAt -> NextUpdate) and the
  # weekly run lands a week later, so a restored cache is always stale — Trivy discards it,
  # pulls the fresh ~100 MB layer anyway, and we upload another ~70 MB for next time. The
  # input defaults to ON, so leaving it out would be the change, not keeping it.
  scan:
    uses: fmmenchi/shared-platform/.github/workflows/security.reusable.yml@gh-actions/v0.2.0
    with:
      app-name: dev-blog
      alert-on-failure: ${{ github.event_name == 'schedule' }}
      cache-db: false
    secrets: inherit
