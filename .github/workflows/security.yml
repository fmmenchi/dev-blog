name: Security

# A vulnerability scan is not like a test. A test goes red because the CODE changed; a
# scan goes red because the WORLD changed — a CVE was published against a dependency
# nobody touched. So it runs on two triggers, and it needs both:
#
#   - when the dependencies change, because that is when WE introduce something;
#   - every Monday, because that is when the world does.
#
# Running it on every push would tell us the same thing forty times a week and teach us
# to stop reading it.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  schedule:
    # Monday 06:00 UTC. Early enough that a bad Monday is still a Monday.
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read
  # The install below reads @fmmenchi/* from GitHub Packages, and declaring any
  # `permissions` block zeroes every scope left out of it.
  packages: read

env:
  # GitHub Packages wants a token even for public packages. `setup` configures the registry
  # through actions/setup-node, which writes an npmrc referring to NODE_AUTH_TOKEN — and the
  # install runs INSIDE that composite action, so a workflow-level env is the only place a
  # caller can put the token.
  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  REGISTRY_URL: https://npm.pkg.github.com
  HUSKY: 0 # a CI install must not run git hooks

jobs:
  # THE BRICKS, CALLED DIRECTLY, rather than shared-platform's turnkey
  # `security.reusable.yml`. Not a preference — the reusable cannot install this repo:
  # it declares `contents: read` alone and calls `setup` without a registry-url, so its
  # `pnpm install --frozen-lockfile` has neither the scope nor the credential for
  # npm.pkg.github.com and dies fetching @fmmenchi/nx-trivy. pnpm reports that 403 as
  # ERR_PNPM_TARBALL_URL_MISMATCH, which is why it reads like a corrupt lockfile.
  # Measured on two runs, at gh-actions/v0 and again at v0.2.0.
  #
  # The scan itself is still shared-platform's — same `trivy-scan` brick the reusable runs,
  # same `notify` for the alert. Only the setup around it is ours, because that is the part
  # that has to know about this repo's registry. Go back to the reusable the day it passes
  # a registry-url through; nothing else here would change.
  scan:
    name: Vulnerabilities & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # .nvmrc is this repo's single source for the Node version — pnpm refuses to install
      # on anything else — and the setup brick takes a version string, not a file.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.2.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          registry-url: ${{ env.REGISTRY_URL }}

      # `cache-db: false` keeps what this repo already decided, back when the scan was ours:
      # Trivy's DB expires in 21 hours (metadata.json, DownloadedAt -> NextUpdate) and the
      # weekly run lands a week later, so a restored cache is always stale — Trivy discards
      # it, pulls the fresh ~100 MB layer anyway, and we upload another ~70 MB for next time.
      # The input defaults to ON, so leaving it out would be the change.
      - name: Scan
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/trivy-scan@gh-actions/v0.2.0
        with:
          cache-db: false

      # Only on the schedule: a pull request already shows a red check, and a message that
      # arrives every week regardless is a message nobody opens.
      - name: Alert Slack on findings
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/notify@gh-actions/v0.2.0
        with:
          kind: error
          app: dev-blog
          message: 'The Trivy audit found CRITICAL/HIGH dependency vulnerabilities.'
          bot-token: ${{ secrets.SLACK_BOT_TOKEN }}
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
