name: Security

# "Did WE introduce something?" — this runs when the dependencies change, and only then.
#
# The other half of the question, "did the WORLD change?", is weekly-audit.yml. They are two
# files because they want opposite settings: the cache is ON here and OFF there, and the
# Slack alert is THERE and not here. A red check on the pull request is already the signal;
# a second one in Slack every time somebody bumps a dependency is how a channel gets muted.
#
# Running it on every push would tell us the same thing forty times a week and teach us to
# stop reading it.
on:
  pull_request:
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  push:
    branches: [main]
    paths:
      - 'pnpm-lock.yaml'
      - '**/package.json'
      - '.trivyignore.yaml'
  workflow_dispatch:

permissions:
  contents: read
  # The install below reads @fmmenchi/* from GitHub Packages, and declaring any
  # `permissions` block zeroes every scope left out of it.
  packages: read

env:
  HUSKY: 0 # a CI install must not run git hooks

jobs:
  # THE BRICKS, CALLED DIRECTLY, rather than shared-platform's turnkey
  # `security.reusable.yml`. That was never a preference: the reusable could not install
  # this repo — it declared `contents: read` alone and called `setup` without a token, so
  # its frozen install had neither the scope nor the credential for npm.pkg.github.com and
  # died fetching @fmmenchi/nx-trivy, which pnpm reports as ERR_PNPM_TARBALL_URL_MISMATCH
  # and therefore reads like a corrupt lockfile. Measured at gh-actions/v0, v0.2.0 and
  # v0.3.1.
  #
  # It is not a choice to revisit any more: the reusable was DELETED at v0.4.0, on the
  # grounds that a file in .github/workflows/ belongs to no nx project, so no release
  # carried it and no check watched it — which is exactly how its internal pins fell two
  # minors behind without anyone being able to notice.
  #
  # The scan itself is still shared-platform's: the same `trivy-scan` brick the reusable
  # ran. Only the setup around it is ours.
  scan:
    name: Vulnerabilities & secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          filter: tree:0

      # .nvmrc is this repo's single source for the Node version — pnpm refuses to install
      # on anything else — and the setup brick takes a version string, not a file.
      - id: node
        run: echo "version=$(cat .nvmrc)" >> "$GITHUB_OUTPUT"

      - uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/setup@gh-actions/v0.4.0
        with:
          node-version: ${{ steps.node.outputs.version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      # The DB cache stays ON here — the default — and that is the opposite call from
      # weekly-audit.yml, deliberately. Trivy's DB expires in about 21 hours: useless to a
      # weekly run, but these triggers cluster. A dependency change arrives as a pull
      # request and then again as a push to main, usually the same day, and the second run
      # restores a DB that is still fresh instead of pulling ~100 MB again.
      - name: Scan
        uses: fmmenchi/shared-platform/packages/ops/gh-actions/actions/trivy-scan@gh-actions/v0.4.0
